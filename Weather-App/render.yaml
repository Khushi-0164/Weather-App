services:
  - type: web
    name: weather-app
    env: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/Weather-App-0.0.1-SNAPSHOT.jar
    envVars:
      - key: WEATHER_API_KEY
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx512m"
    healthCheckPath: /actuator/health
